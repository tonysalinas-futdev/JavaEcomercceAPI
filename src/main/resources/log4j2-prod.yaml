status: WARN
name: PropertiesConfig

appenders:
    RollingFile:
      JsonTemplateLayout:
        eventTemplateUri:
          "classpath:EcsLayout.json"
      name: RollingFile
      fileName: logs/application.log
      filePattern: logs/application-%d{yyyy-MM-dd}.log

      Policies:
        TimeBasedTriggeringPolicy:
          interval: 1
          modulate: true

        SizeBasedTriggeringPolicy:
          size: 10 MB

      DefaultRolloverStrategy:
        max: 30

loggers:

  root:
    level: info
    AppenderRef:
      ref: RollingFile