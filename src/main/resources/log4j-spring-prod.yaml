Configuration:
  RollingFile:
    name: FileAppender
    filename: "logs/ecommerce.log" 
    filePattern: logs/ecommerce-%d{yyyy-MM-dd}.log 
    PatternLayout: 
      pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n" 
    Policies: 
      TimeBasedTriggeringPolicy: {}
  Loggers:
    Root:
      level: info
    AppenderRef:
      -ref: FileAppender