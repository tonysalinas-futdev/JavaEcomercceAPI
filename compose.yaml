services:
  redis:
    image: redis:${REDIS_VERSION:-latest}
    container_name: ecomercce-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "''", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - redis

  postgres:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: ecommerce_postgres_container
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD_PASSWORD:-admin}
      POSTGRES_DB: ecommerce_db

    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/${POSTGRES_HOST:-localhost}/${POSTGRES_PORT:-5432}'" ]
      interval: 10s
      timeout: 20s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - postgres

  application:
    container_name: ecommerce-container
    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    env_file:
      - .env
    environment:
        REDIS_HOST: redis
        DATABASE_HOST: postgres
        ACTIVE_PROFILE: ${ACTIVE_PROFILE:-dev}


    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -f http://localhost:8080/actuator/health || exit 1"
      ]
      interval: 10s
      timeout: 20s
      retries: 5

    networks:
      - postgres
      - redis





  grafana:
      image: grafana/grafana
      container_name: grafana
      ports:
        - '3000:3000'
      volumes:
        - grafana-storage:/var/lib/grafana
        - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro


      healthcheck:
        test: [
            "CMD-SHELL",
            "curl -f http://localhost:3000/api/health || exit 1"
          ]
        interval: 10s
        timeout: 20s
        retries: 5

  alloy:
    image: grafana/alloy:latest
    container_name: grafana-alloy-spring
    env_file:
      - ./docker-config/alloy/.env
    volumes:
      - ./docker-config/alloy/config.alloy:/etc/alloy/config.alloy
      - alloy_data:/var/lib/alloy
    ports:
      - "4317:4317"   # OTEL gRPC
      - "4318:4318"   # OTEL HTTP
      - "9999:9999"   # Pyroscope HTTP
      - "12345:12345" # Alloy HTTP
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:12345/-/healthy" ]
      interval: 30s
      timeout: 30s
      retries: 5


  loki:
    image: grafana/loki:main-dbc7ebc
    container_name: grafana-loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker-config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki




volumes:
  redis_data:
  pg_data:
  otel_lgtm_data:
  grafana-storage:
  alloy_data:
  loki_data:


networks:
  postgres:
  redis:

